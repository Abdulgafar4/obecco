<header style="position:sticky;top:0;z-index:40;background:rgba(233,234,229,0.9);backdrop-filter:blur(10px);border-bottom:1px solid #D4D6CD">

      </button>
      <div data-desktop-nav="" style="display:flex;align-items:center;gap:24px">

        </nav>

      <button type="button" data-hamburger="" aria-label="Open menu" aria-expanded="false" data-action="toggle-menu" style="display:none;align-items:center;gap:9px;background:none;border:1px solid #C6C9BF;border-radius:6px;padding:9px 13px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.07em;text-transform:uppercase;color:#16161A">
        <span data-hamburger-label="">Menu</span>
        <span aria-hidden="true" style="display:flex;flex-direction:column;gap:3px">
          <span style="width:15px;height:1.5px;background:#16161A;display:block"></span>
          <span style="width:15px;height:1.5px;background:#16161A;display:block"></span>
        </span>
      </button>
    </div>
    <div data-mobile-menu="" style="display:none;flex-direction:column;border-top:1px solid #D4D6CD;background:#F1F2EE;padding:10px 24px 20px">

        <button type="button" data-mnav="contact" data-go="contact" style="background:none;border:none;padding:14px 0;cursor:pointer;color:#16161A;font:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left">Contact</button>

        <button type="button" data-go="clevermart" style="background:none;border:none;padding:9px 0;cursor:pointer;color:#3C403A;font-family:'IBM Plex Mono',monospace;font-size:12.5px;text-align:left">03 &nbsp;Clevermart</button>
        <button type="button" data-go="cleverjobs" style="background:none;border:none;padding:9px 0;cursor:pointer;color:#3C403A;font-family:'IBM Plex Mono',monospace;font-size:12.5px;text-align:left">04 &nbsp;CleverJobs</button>
